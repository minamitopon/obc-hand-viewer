<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe7" />
    <title>OBC Hand Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <p class="eyebrow">OSAKA BRIDGE CENTER</p>
        <h1>Hand Viewer</h1>
        <p class="intro">プレイの例が確認できます。</p>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <label class="search-box">
          <span class="sr-only">試合を検索</span>
          <input id="search" type="search" placeholder="試合名を検索" autocomplete="off" />
        </label>
      </div>
      <section id="results" class="date-list" aria-live="polite"></section>
    </main>

    <footer class="site-footer">OBC hand results</footer>
    <script src="./matches.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
